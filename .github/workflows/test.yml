name : premier workflow

on:
  push: #pull_request peut remplacer pull
    branches:
      - main
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépot
        uses: actions/checkout@v4

      - name: Exécuter un scipt
        run: bash scripts/hello.sh

      - name:
        run: echo "Workflow terminé !"